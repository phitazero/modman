[package]
name = "modman"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
serde = "1.0.228"
serde_json = "1.0.145"
serde_urlencoded = "0.7"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
directories = "6.0.0"
clap = { version = "4.6.0", features = ["derive"] }

[profile.release]
strip = true
opt-level = 's'
